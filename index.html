<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Explore React components and animations across independent libraries. Preview original components, filter by purpose, and compare your favorites."
    />
    <meta name="theme-color" content="#f8f8f5" />
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("super-ui:theme");
        } catch (_) {}
        if (theme !== "light" && theme !== "dark")
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Super UI · Find your next component</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
