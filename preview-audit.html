<!doctype html><html><head><meta charset="utf-8"><title>Super UI preview audit</title><style>body{font:13px system-ui;background:#eee;color:#222;margin:20px}iframe{width:480px;height:360px;border:1px solid #ccc;background:white}pre{white-space:pre-wrap}#workers{display:flex;gap:10px}#results{max-height:350px;overflow:auto}</style></head><body><h1>Original preview smoke audit</h1><p id="progress">Loading catalog…</p><div id="workers"></div><pre id="failures"></pre><pre id="results"></pre><script type="module">
const data=await(await fetch('/catalog.json')).json();const params=new URLSearchParams(location.search);const entries=data.entries.filter(e=>e.status==='live'&&(!params.get('library')||e.library===params.get('library')));let cursor=0,done=0;const results=[];const failures=[];document.body.dataset.state='running';
function update(){document.querySelector('#progress').textContent=`${done} / ${entries.length} checked · ${failures.length} errors`;document.querySelector('#results').textContent=JSON.stringify(results);document.querySelector('#failures').textContent=JSON.stringify(failures,null,2);document.body.dataset.completed=String(done);document.body.dataset.errors=String(failures.length)}
async function check(entry){return new Promise(resolve=>{let finished=false,timer;const frame=document.createElement('iframe');frame.title=entry.id;frame.src=`/preview.html?id=${encodeURIComponent(entry.id)}&theme=${params.get('theme')||'light'}`;document.querySelector('#workers').append(frame);function finish(error){if(finished)return;finished=true;clearTimeout(timer);window.removeEventListener('message',receive);frame.remove();resolve({id:entry.id,error:error||null})}const timeout=setTimeout(()=>finish('Preview did not load within 20 seconds'),20000);function complete(error){clearTimeout(timeout);finish(error)}function receive(e){if(e.source!==frame.contentWindow||e.origin!==location.origin||e.data?.id!==entry.id)return;if(e.data.state==='error')complete(e.data.message);if(e.data.state==='loaded'){timer=setTimeout(()=>{const root=frame.contentDocument.querySelector('.preview-root');complete(root&&root.childElementCount?'':'Empty original demo')},1000)}}window.addEventListener('message',receive)})}
async function worker(){while(cursor<entries.length){const entry=entries[cursor++];const result=await check(entry);results.push(result);if(result.error)failures.push(result);done++;update()}}
await Promise.all([worker(),worker()]);document.body.dataset.state='complete';update();
</script></body></html>
